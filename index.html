<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ImpactMe</title>
    <meta name="description" content="Your personal space to plan, organize, reflect and grow." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved theme before first paint so there's no light/dark flash.
      // ImpactMe mirrors its theme setting here; Daybook used 'ui.theme'.
      try {
        let saved = localStorage.getItem('impactme.theme')
        if (!saved) saved = JSON.parse(localStorage.getItem('ui.theme'))
        const dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <style>
      /* Shown until the app has loaded its data. */
      .splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 14px;
        background: #ffffff;
        color: #0e8a6a;
        font: 700 18px/1 system-ui, sans-serif;
        letter-spacing: -0.02em;
      }
      [data-theme='dark'] .splash {
        background: #0f1513;
        color: #34c79a;
      }
      .splash svg {
        animation: splash-spin 1.4s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      }
      .splash span {
        color: #14201b;
      }
      [data-theme='dark'] .splash span {
        color: #e6eeea;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash svg {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" aria-label="Loading ImpactMe">
        <svg width="44" height="44" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="3.2" opacity="0.28" />
          <path d="M16 5A11 11 0 1 1 5 16" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" />
          <circle cx="16" cy="16" r="3.6" fill="currentColor" />
        </svg>
        <span>ImpactMe</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
